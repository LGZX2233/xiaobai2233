[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-kernel"
version = "1.0.0"
description = "Project Kernel v1: independent execution-flow + project-data core (Python 3.12+)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.26.0,<5",
    "jcs==0.2.1",
    "packaging>=24,<27",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
